<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIT Control — Login</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <div class="login-logo">AIT Control</div>
    <div class="login-sub">Zero Pontos — gestão de autuações</div>
    <div class="login-error" id="login-error"></div>
    <div class="form-group">
      <label class="form-label">E-mail</label>
      <input class="form-ctrl" id="email" type="email" placeholder="seu@email.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label class="form-label">Senha</label>
      <input class="form-ctrl" id="senha" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" style="width:100%;margin-top:4px" id="btn-login" onclick="doLogin()">Entrar</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
  // Se já estiver logado, redireciona direto
  Auth.getSession().then(s => { if (s) window.location.href = 'app.html' })

  document.getElementById('senha').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin()
  })

  async function doLogin() {
    const email = document.getElementById('email').value.trim()
    const senha = document.getElementById('senha').value
    const btn = document.getElementById('btn-login')
    const err = document.getElementById('login-error')
    err.style.display = 'none'
    btn.textContent = 'Entrando...'
    btn.disabled = true
    try {
      await Auth.login(email, senha)
      window.location.href = 'app.html'
    } catch (e) {
      err.textContent = 'E-mail ou senha incorretos'
      err.style.display = 'block'
      btn.textContent = 'Entrar'
      btn.disabled = false
    }
  }
</script>
</body>
</html>
